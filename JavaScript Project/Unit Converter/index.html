<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- <div class="heading"> -->
      <h1 id="heading">Metric/Imperial Unit Conversion</h1>
      <!-- </div> -->
      <!-- <div class="number"> -->
      <input type="number" id="input-number" />
      <!-- </div> -->
      <!-- <div class="button"> -->
      <button id="convert-btn">Convert</button>
      <!-- </div> -->
    </div>

    <div class="conversion">
      <div class="length box">
        <h3 class="text">Length (Meter/Feet)</h3>
        <p id="length-text"></p>
      </div>
      <div class="volume box">
        <h3 class="text">Volume (Liter/Gallon):</h3>
        <p id="volume-text"></p>
      </div>
      <div class="mass box">
        <h3 class="text">Mass (Kilogram/Pound):</h3>
        <p id="mass-text"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
