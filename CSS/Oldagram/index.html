<html>
  <head>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <img src="images/logo.png" alt="Oldagram Logo" width="300" />
        <img
          src="../portfoliochallenge/My Photo.jpeg"
          alt="Oldagram"
          id="myImg"
          class="profile-pic"
        />
      </div>
      <hr />
    </header>
    <main>
      <section class="dp-sec">
        <div class="profile">
          <img
            src="images/avatar-vangogh.jpg"
            alt="Profile Picture"
            width="100%"
            id="pro-pic"
          />
          <div>
            <h3>Vincent van Gogh</h3>
            <p id="location">Amsterdam, Netherlands</p>
          </div>
        </div>
      </section>

      <section class="post-sec">
        <div class="post-photo">
          <img
            src="images/post-vangogh.jpg"
            alt="Post Image"
            width="100%"
            id="post-img"
          />
        </div>
      </section>

      <div class="like-com">
        <img
          src="images/icon-heart.png"
          alt="Heart Icon"
          width="30px"
          class="like-icon"
        />
        <img
          src="images/icon-comment.png"
          alt="Comment Icon"
          width="30px"
          class="comment-icon"
        />
        <img
          src="images/icon-dm.png"
          alt="Share Icon"
          width="30px"
          class="share-icon"
        />
      </div>

      <div class="text-content">
        <p class="likes" id="likes-count">21492 likes</p>
        <p class="rest">
          <span>Vincey1852</span> just took a few mushrooms lol
        </p>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
